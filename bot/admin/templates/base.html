<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админка «Ваш Финдир»{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    /* Pico не выравнивает формы по центру — компактная карточка для входа */
    .login-box { max-width: 380px; margin: 10vh auto 0; }
    .login-box h1 { margin-bottom: 1.5rem; text-align: center; }
    .login-box button[type="submit"] { width: 100%; }
    .error { color: #b00020; }
  </style>
</head>
<body>
  <header class="container">
    <strong>«Ваш Финдир» — админка</strong>
    {% if request.session.get('admin_user') %}
    <form class="inline" method="post" action="/admin/logout" style="display: inline; margin: 0;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="secondary" style="margin: 0;">Выйти</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
