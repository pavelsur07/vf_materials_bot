# Server-блок nginx для mybots.vashfindir.ru — ИСТОЧНИК ПРАВДЫ.
# deploy/deploy.sh при каждом деплое ставит этот файл в
# /etc/nginx/sites-available/mybots (+ symlink в sites-enabled), делает
# nginx -t и reload. Правки на сервере вручную будут перезаписаны — меняйте
# здесь. Строки «managed by Certbot» трогать нельзя: certbot их обновляет
# при перевыпуске сертификата.
#
# Бот слушает 127.0.0.1:8081 (WEBAPP_HOST/WEBAPP_PORT), путь — WEBHOOK_PATH.
# Админка слушает 127.0.0.1:8082 (ADMIN_HOST/ADMIN_PORT), путь — /admin/.
# API слушает 127.0.0.1:8083 (API_HOST/API_PORT), путь — /api/.
server {
    server_name mybots.vashfindir.ru;

    location /vashfindir {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Документация API: Swagger UI на /api/docs, ReDoc на /api/docs/redoc,
    # openapi.json на /api/docs/openapi.json. Путь должен совпадать с API_DOCS_PATH
    # в .env (по умолчанию /api/docs). Basic auth: htpasswd-файл генерирует
    # deploy/deploy.sh из API_DOCS_USER/API_DOCS_PASSWORD (.env).
    location /api/docs {
        auth_basic "VF API docs";
        auth_basic_user_file /etc/nginx/.htpasswd-api-docs;
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Quickstart для интеграторов — открытая страница. Exact-локация важна:
    # без неё префикс /api/docs перехватил бы и /api/docs-page.
    location = /api/docs-page {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Релей уведомлений о лидах: сайт шлёт POST сюда, сервис api (bot/api) пересылает в Telegram
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/mybots.vashfindir.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/mybots.vashfindir.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = mybots.vashfindir.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name mybots.vashfindir.ru;
    return 404; # managed by Certbot


}
