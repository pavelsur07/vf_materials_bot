# Пример server-блока nginx для mybots.vashfindir.ru.
# Бот слушает 127.0.0.1:8081 (WEBAPP_HOST/WEBAPP_PORT), путь — WEBHOOK_PATH.
# SSL-сертификат на домен — обязателен, Telegram шлёт webhook только на HTTPS.

server {
    listen 443 ssl;
    server_name mybots.vashfindir.ru;

    # ssl_certificate /etc/letsencrypt/live/mybots.vashfindir.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mybots.vashfindir.ru/privkey.pem;

    location /vashfindir {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
