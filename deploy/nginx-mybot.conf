# Пример server-блока nginx для mybots.vashfindir.ru.
# Бот слушает 127.0.0.1:8081 (WEBAPP_HOST/WEBAPP_PORT), путь — WEBHOOK_PATH.
# Админка слушает 127.0.0.1:8082 (ADMIN_HOST/ADMIN_PORT), путь — /admin/.
# API слушает 127.0.0.1:8083 (API_HOST/API_PORT), путь — /api/.
# SSL-сертификат на домен — обязателен: Telegram шлёт webhook только на HTTPS,
# а сессионная кука админки помечена Secure.

server {
    listen 443 ssl;
    server_name mybots.vashfindir.ru;

    # ssl_certificate /etc/letsencrypt/live/mybots.vashfindir.ru/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/mybots.vashfindir.ru/privkey.pem;

    location /vashfindir {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Релей уведомлений о лидах: сайт шлёт POST сюда, сервис api (bot/api) пересылает в Telegram
    location /api/ {
        proxy_pass http://127.0.0.1:8083;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://127.0.0.1:8082;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
