<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Админка «Ваш Финдир»{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <style>
    /* Компактная плотность админки: база 14px, без роста шрифта на широких экранах */
    html:root {
      --pico-font-size: 87.5%;
      --pico-line-height: 1.45;
      --pico-spacing: 0.625rem;
      --pico-form-element-spacing-vertical: 0.35rem;
      --pico-form-element-spacing-horizontal: 0.7rem;
      --pico-border-radius: 0.2rem;
    }
    h1 { --pico-font-size: 1.5rem; }
    h2 { --pico-font-size: 1.25rem; }

    body > header { padding-block: 0.75rem; }

    /* Таблицы — плотные, числа моноширинной ширины (tabular-nums) */
    table { font-variant-numeric: tabular-nums; }
    th, td { padding: 0.3rem 0.6rem; }

    /* Pico не выравнивает формы по центру — компактная карточка для входа */
    .login-box { max-width: 340px; margin: 8vh auto 0; }
    .login-box h1 { margin-bottom: 1rem; text-align: center; }
    .login-box button[type="submit"] { width: 100%; }
    .error { color: #b00020; }
    .ok { color: #1a7f37; }

    /* Навигация разделов в виде компактных табов */
    .header-tabs {
      display: inline-flex;
      gap: 0.25rem;
      margin-left: 1rem;
      vertical-align: middle;
    }
    .header-tab {
      display: inline-flex;
      align-items: center;
      min-height: 2rem;
      padding: 0.3rem 0.75rem;
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      color: var(--pico-muted-color);
      text-decoration: none;
    }
    .header-tab:hover {
      border-color: var(--pico-primary-border);
      color: var(--pico-primary);
    }
    .header-tab.active,
    .header-tab.active:hover {
      background: var(--pico-primary-background);
      border-color: var(--pico-primary-background);
      color: var(--pico-primary-inverse);
    }
  </style>
</head>
<body>
  <header class="container">
    <strong>«Ваш Финдир» — админка</strong>
    {% if request.session.get('admin_user') %}
    {% set current_path = request.url.path %}
    <nav class="header-tabs" aria-label="Разделы админки">
      <a href="/admin/"
         class="header-tab{% if current_path == '/admin/' %} active{% endif %}"
         {% if current_path == '/admin/' %}aria-current="page"{% endif %}>Пользователи</a>
      <a href="/admin/slides"
         class="header-tab{% if current_path != '/admin/' and current_path.startswith('/admin/slides') %} active{% endif %}"
         {% if current_path != '/admin/' and current_path.startswith('/admin/slides') %}aria-current="page"{% endif %}>Слайды</a>
    </nav>
    <form class="inline" method="post" action="/admin/logout" style="display: inline; margin: 0 0 0 1rem; float: right;">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button type="submit" class="secondary" style="margin: 0;">Выйти</button>
    </form>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      document.querySelectorAll("form").forEach((form) => {
        form.addEventListener("submit", () => {
          form.querySelectorAll("button[type='submit']").forEach((button) => {
            button.disabled = true;
          });
        });
      });
    });
  </script>
</body>
</html>
